name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  # ── Job 1: GitHub Pages ───────────────────────────────────────────────────────
  github-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          exclude_assets: '.github,functions,node_modules,supabase,.gitignore'

  # ── Job 2: Firebase Hosting + Firestore only (no functions) ──────────────────
  firebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Firebase Hosting + Firestore
        run: firebase deploy --only hosting,firestore --project tonight-vietnam
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

  # ── Job 3: Firebase Functions (only runs when functions/ changes) ─────────────
  firebase-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install Cloud Functions dependencies
        run: cd functions && npm install

      - name: Write functions env
        run: |
          echo "EMAIL_USER=${{ secrets.EMAIL_USER }}" > functions/.env
          echo "EMAIL_PASS=${{ secrets.EMAIL_PASS }}" >> functions/.env
          echo "EMAIL_FROM=Tonight Vietnam <noreply@tonightvietnam.com>" >> functions/.env

      - name: Deploy Firebase Functions
        run: firebase deploy --only functions --project tonight-vietnam --force
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
