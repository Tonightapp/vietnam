name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # ── Job 1: GitHub Pages (always runs) ────────────────────────────────────────
  github-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          folder: .
          branch: gh-pages
          clean: true
          clean-exclude: |
            .nojekyll
          single-commit: true

  # ── Job 2: Firebase Hosting + Firestore (always runs) ────────────────────────
  firebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Firebase Hosting + Firestore
        run: firebase deploy --only hosting,firestore --project tonight-vietnam
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

  # ── Job 3: Firebase Functions (only when functions/ changes) ──────────────────
  firebase-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if functions changed
        id: check
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q '^functions/'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Install Firebase CLI
        if: steps.check.outputs.changed == 'true'
        run: npm install -g firebase-tools

      - name: Install Cloud Functions dependencies
        if: steps.check.outputs.changed == 'true'
        run: cd functions && npm install

      - name: Write functions env
        if: steps.check.outputs.changed == 'true'
        run: |
          printf 'EMAIL_USER=%s\n' "$EMAIL_USER" > functions/.env
          printf 'EMAIL_PASS=%s\n' "$EMAIL_PASS" >> functions/.env
          printf 'EMAIL_FROM=Tonight Vietnam <%s>\n' "$EMAIL_USER" >> functions/.env
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}

      - name: Deploy Firebase Functions
        if: steps.check.outputs.changed == 'true'
        run: firebase deploy --only functions --project tonight-vietnam --force
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
